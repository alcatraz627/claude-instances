<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Code session</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23191a21'/%3E%3Cg stroke='%23d97757' stroke-width='5.5' stroke-linecap='round'%3E%3Cpath d='M32 32 32 9'/%3E%3Cpath d='M32 32 46 14'/%3E%3Cpath d='M32 32 55 27'/%3E%3Cpath d='M32 32 50 44'/%3E%3Cpath d='M32 32 37 55'/%3E%3Cpath d='M32 32 21 52'/%3E%3Cpath d='M32 32 10 42'/%3E%3Cpath d='M32 32 9 25'/%3E%3Cpath d='M32 32 18 11'/%3E%3C/g%3E%3Ccircle cx='51' cy='51' r='6' fill='%234fb6a6' stroke='%23191a21' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/hub-shared.css?v=2">
<style>
/* ============================================================ V3 "CHAPTERS"
   Conviction: a session is a story of your asks; skim is the primary job.
   Your prompts are chapter titles. Claude's prose flows beneath them. All the
   work between prompts folds into one activity-ledger line per run. The
   overview is an outline (sidebar/drawer) + a segmented progress spine.
   Register: editorial reader in the dark house palette — serif display,
   big prose, quiet dense chrome. */
:root {
    /* the one type scale (owner D6a); the View panel's text size scales all of it through --k */
    --k: 1;
    --t-xs: calc(11px * var(--k)); --t-sm: calc(12.5px * var(--k)); --t-md: calc(14px * var(--k));
    --t-lg: calc(16px * var(--k)); --t-xl: calc(20px * var(--k)); --t-2xl: calc(25px * var(--k));
    color-scheme: dark;
    --bg: #191a21; --bg2: #21232c; --well: #1d1f27; --sel: #2b2d38;
    --edge: rgba(200,205,225,.13); --edge2: rgba(200,205,225,.24);
    --text: #edeef4; --dim: #a2a7b8; --faint: #676d80;
    --you: oklch(0.76 0.15 268); --claude: oklch(0.76 0.14 180);
    --tool: #e2b05b; --err: #ea8578; --add: oklch(0.75 0.14 142); --del: #ea8578;
    --meta: oklch(0.74 0.11 305);   /* violet — git/meta hint only */
    --sky: oklch(0.76 0.11 230); --rose: oklch(0.74 0.13 350);
    --out: #20222b;   /* an opened call's output: one shade off the page */
    --term: #1c1d25;  /* its input: a touch darker, like a terminal */
    --mark: rgba(226,176,91,.3);
    --you-soft: color-mix(in srgb, var(--you) 10%, transparent);
    --you-ring: color-mix(in srgb, var(--you) 40%, transparent);
    --claude-soft: color-mix(in srgb, var(--claude) 12%, transparent);
    --tool-soft: color-mix(in srgb, var(--tool) 12%, transparent);
    --err-soft: color-mix(in srgb, var(--err) 10%, transparent);
    --sans: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --fs-prose: calc(15px * var(--k)); --lh-prose: 1.68; --measure: 680px;
    --r: 8px; --tb-h: 52px;
    --ease: cubic-bezier(.2,0,0,1); --t-fast: 130ms; --t-slow: 260ms;
    --shadow: 0 10px 32px -12px rgba(0,0,0,.6);
}
:root.light {
    color-scheme: light;
    --bg: #faf9f6; --bg2: #f1efe9; --well: #f4f2ed; --sel: #e8e5dd;
    --edge: rgba(35,32,24,.13); --edge2: rgba(35,32,24,.26);
    --text: #1e1f24; --dim: #565b68; --faint: #8e93a1;
    --you: oklch(0.46 0.16 268); --claude: oklch(0.46 0.15 180);
    --tool: #7e5d0e; --err: #b23f33; --add: oklch(0.46 0.14 142); --del: #b23f33;
    --meta: oklch(0.46 0.13 305);
    --sky: oklch(0.5 0.12 230); --rose: oklch(0.52 0.16 350);
    --out: #fdfcfa;
    --term: #f6f4ef;
    --mark: rgba(216,160,32,.32);
    --shadow: 0 10px 32px -12px rgba(40,36,20,.24);
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--tb-h) + 14px); }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-prose)/var(--lh-prose) var(--sans); }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
.icon { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ================= sticky top bar */
.topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--tb-h); z-index: 60;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--edge); }
.tb-back { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); text-decoration: none;
    font: 600 var(--t-sm) var(--sans); padding: 6px 8px; border-radius: var(--r); white-space: nowrap; }
.tb-back:hover { background: var(--sel); color: var(--text); }
.tb-back .brand, .tb-brand .brand { width: 18px; height: 18px; flex: none; }
.tb-back { gap: 7px; font-size: var(--t-md); color: var(--text); }
.tb-sep { flex: none; width: 1px; height: 20px; background: var(--edge2); }
.tb-title { font-size: var(--t-md); }
.tb-title { font: 600 var(--t-sm) var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    opacity: 0; transition: opacity var(--t-slow) var(--ease); cursor: pointer; min-width: 0; }
.tb-ch { flex: none; font: 700 var(--t-xs) var(--mono); color: var(--faint); opacity: 0;
    transition: opacity var(--t-slow) var(--ease); white-space: nowrap; }
.topbar.scrolled .tb-title, .topbar.scrolled .tb-ch { opacity: 1; }
/* the session's state: a pill with what it is, since when, and what it last did */
.tb-live { --lc: var(--claude); flex: none; display: inline-flex; align-items: center; gap: 8px; height: 34px;
    padding: 0 12px 0 11px; border-radius: 999px; font: 600 var(--t-sm) var(--sans); color: var(--text);
    background: color-mix(in srgb, var(--lc) 11%, transparent); border: 1px solid color-mix(in srgb, var(--lc) 28%, transparent); }
.tb-live.yourturn { --lc: var(--you); }
.tb-live.ended { --lc: var(--faint); }
.tb-live .pulse { color: var(--lc); }
.tb-live .lv-state { color: var(--lc); font-weight: 700; }
.tb-live .lv-for { color: var(--dim); font: var(--t-xs) var(--mono); font-variant-numeric: tabular-nums; }
.tb-live .lv-what { display: none; }   /* what it last did lives in the tooltip; the bar never cuts text */
.tb-live .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; position: relative; }
.tb-live.working .pulse::after { content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 1.5px solid currentColor; opacity: 0; animation: pulse 2s var(--ease) infinite; }
@keyframes pulse { 0% { transform: scale(.4); opacity: .8; } 70%,100% { transform: scale(1.1); opacity: 0; } }
.tb-sp { flex: 1; min-width: 0; }
/* the hub stopped answering: say so under the top bar until a poll succeeds */
.connbar { position: fixed; top: var(--tb-h); left: 0; right: 0; z-index: 59; display: none;
    align-items: center; gap: 8px; padding: 7px 14px; font: var(--t-sm) var(--sans); color: var(--text);
    background: color-mix(in srgb, var(--err) 16%, var(--bg)); border-bottom: 1px solid color-mix(in srgb, var(--err) 45%, transparent); }
.connbar.on { display: flex; }
.connbar .icon { color: var(--err); }
.connbar span { color: var(--dim); font: var(--t-xs) var(--mono); }
/* top bar controls: plain icon buttons, one size, named by their tooltip */
.tbtn { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0;
    border: 1px solid var(--edge); border-radius: 10px; background: var(--bg2); color: var(--dim);
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.tbtn:hover { background: var(--sel); color: var(--text); }
.tbtn[aria-pressed="true"] { color: var(--text); background: var(--sel); box-shadow: 0 0 0 1px var(--edge2); }
.tbtn .icon { width: 17px; height: 17px; }
.tb-grp { display: inline-flex; gap: 6px; }
/* the outline is a sidebar on a wide screen, so its button only exists for the drawer */
@media (min-width: 1100px) { #olBtn { display: none; } }
.vp-grp:has(#vpDir), .vp-grp:has(#vpTheme) { display: none; }
@media (max-width: 640px) { .tbtn { width: 32px; height: 32px; border-radius: 9px; } .tbtn .icon { width: 15px; height: 15px; } .tb-live { height: 32px; } }
/* on a phone the buttons need the room: back is an arrow, no chapter count */
@media (max-width: 480px) {
    .topbar { gap: 4px; padding: 0 8px; }
    .tb-back-lb, .tb-ch, .tb-live .lv-for { display: none; }
    .tb-title, .tb-sep { display: none; }   /* no room to show it whole; the masthead has it */
}

/* ================= layout: outline sidebar + reading column */
.layout { display: flex; max-width: 1220px; margin: 0 auto; padding-top: var(--tb-h); }
.outline { width: 280px; flex: none; position: sticky; top: var(--tb-h); align-self: flex-start;
    max-height: calc(100vh - var(--tb-h)); overflow-y: auto; overscroll-behavior: contain;
    padding: 22px 8px 40px 16px; }
.ol-cap { font: 700 var(--t-xs) var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); padding: 0 10px 8px; }
.ol-item { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: none;
    border-radius: var(--r); padding: 7px 10px; color: var(--dim); align-items: baseline;
    transition: background var(--t-fast) var(--ease); }
.ol-item:hover { background: var(--sel); color: var(--text); }
.ol-item.cur { background: var(--you-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--you);
    border-radius: 0 var(--r) var(--r) 0; }
.ol-num { flex: none; font: 700 var(--t-xs) var(--mono); color: var(--faint); width: 2ch; padding-top: 3px; }
.ol-item.cur .ol-num { color: var(--you); }
.ol-t { min-width: 0; }
.ol-title { display: block; font: 600 var(--t-sm) var(--sans); line-height: 1.4; overflow-wrap: anywhere; }
.ol-t { flex: 1; }
.ol-ts { flex: none; font: var(--t-xs) var(--mono); color: var(--faint); padding-top: 2px; }
.ol-item.cur .ol-ts { color: var(--you); }
.ol-meta:empty { display: none; }
.ol-meta { display: flex; flex-wrap: wrap; gap: 0 6px; font: var(--t-xs) var(--mono); color: var(--faint); margin-top: 2px; }
.ol-meta > span { white-space: nowrap; }
.ol-meta { gap: 0 10px; }
.ol-meta .e { color: var(--err); font-weight: 700; }
@media (max-width: 1099px) {
    .outline { position: fixed; left: 0; top: var(--tb-h); bottom: 0; z-index: 70; background: var(--bg);
        border-right: 1px solid var(--edge2); box-shadow: var(--shadow); translate: -100% 0;
        transition: translate var(--t-slow) var(--ease); max-height: none; width: min(320px, 86vw); }
    .outline.open { translate: 0 0; }
    .scrim { position: fixed; inset: var(--tb-h) 0 0 0; z-index: 65; background: rgba(0,0,0,.4);
        opacity: 0; pointer-events: none; transition: opacity var(--t-slow) var(--ease); }
    .scrim.on { opacity: 1; pointer-events: auto; }
}
@media (min-width: 1100px) { .scrim { display: none; } }
main { flex: 1; min-width: 0; padding: 0 20px 30vh; }
.colwrap { max-width: var(--measure); margin: 0 auto; }

/* ================= masthead — the title page */
.masthead { padding: 18px 0 8px; }
.mh-kicker { font: 700 var(--t-xs) var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.mh-kicker .live { color: var(--claude); }
.mh-title { font: 600 var(--t-xl)/1.25 var(--serif); letter-spacing: -.012em;
    margin: 10px 0 12px; text-wrap: balance; }
.mh-byline { font: var(--t-sm) var(--mono); color: var(--dim); display: flex; flex-wrap: wrap; gap: 5px 16px; }
.mh-byline .bi { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.mh-byline .icon { width: 12.5px; height: 12.5px; color: var(--faint); }
/* hint colours on session identity — icon + a whisper on the value */
.bi.model .icon { color: var(--claude); } .bi.model { color: color-mix(in srgb, var(--claude) 45%, var(--dim)); }
.bi.branch .icon { color: var(--meta); } .bi.branch { color: color-mix(in srgb, var(--meta) 40%, var(--dim)); }
.bi.perm .icon { color: var(--tool); } .bi.perm { color: color-mix(in srgb, var(--tool) 45%, var(--dim)); }
.mh-colophon { margin-top: 16px; padding: 10px 0; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    font: var(--t-sm) var(--mono); font-variant-numeric: tabular-nums; color: var(--dim);
    display: flex; flex-wrap: wrap; gap: 4px 18px; }
.mh-colophon b { color: var(--text); font-weight: 700; }
.mh-colophon .in b { color: var(--you); } .mh-colophon .out b { color: var(--claude); }
/* the session in figures: value over label, read across */
.mh-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px 8px;
    margin-top: 18px; padding: 12px 0; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
.mh-stats .st { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mh-stats .v { font: 600 var(--t-lg)/1.2 var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.mh-stats .l { font: var(--t-xs) var(--sans); color: var(--faint); }
/* one timeline at a time: with the session timeline showing, the chapter spine repeats it */
body:has(#cctl.on) .spine, body:has(#cctl.on) .spine-cap { display: none; }
/* progress spine — one segment per chapter */
.spine { display: flex; gap: 3px; margin-top: 14px; height: 8px; }
.spine span { flex: 1; border-radius: 3px; background: var(--sel); cursor: pointer; position: relative;
    transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); min-width: 4px; }
.spine span:hover { transform: scaleY(1.5); }
.spine span:hover { background: var(--edge2); }
.spine span.done { background: color-mix(in srgb, var(--you) 45%, var(--sel)); }
.spine span.cur { background: var(--you); }
.spine span.err::after { content: ''; position: absolute; top: -3px; right: 0; width: 4px; height: 4px;
    border-radius: 50%; background: var(--err); }
/* a long session has more chapters than the column has 7px slots */
.spine { overflow: hidden; }
.spine.dense { gap: 1px; }
.spine.dense span { min-width: 1px; border-radius: 1px; }
.spine-cap { display: flex; justify-content: space-between; font: var(--t-xs) var(--mono); color: var(--faint); margin-top: 5px; }

/* ================= chapters */
.chapter { margin-top: 22px; }
.ch-head { display: flex; gap: 14px; padding-top: 26px; border-top: 1px solid var(--edge);
    scroll-margin-top: calc(var(--tb-h) + 10px); }
.chwrap:first-child .chapter .ch-head { border-top: none; padding-top: 8px; }
/* fillChapter keeps the reading position itself; the browser's own scroll
   anchoring (absent in Safari) would apply the same shift a second time */
html, body { overflow-anchor: none; }
/* chapter head: number, title, then one quiet line of facts */
.ch-num { flex: none; align-self: flex-start; margin-top: 4px; min-width: 30px; height: 22px; padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 6px;
    font: 700 var(--t-xs) var(--mono); color: var(--you); background: var(--you-soft); font-variant-numeric: tabular-nums; }
.ch-body { min-width: 0; flex: 1; }
.ch-title { font: 600 var(--t-xl)/1.3 var(--serif); letter-spacing: -.01em; margin: 0; text-wrap: pretty; cursor: pointer; overflow-wrap: anywhere; }
.ch-title:hover { color: var(--you); }
.ch-title.sh { font: 600 var(--t-lg)/1.4 var(--mono); letter-spacing: 0; }
.ch-title.sh .bang { color: var(--tool); margin-right: .5ch; }
.ch-meta { font: var(--t-xs) var(--mono); color: var(--dim); margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.ch-meta .cm { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ch-meta .cm b { color: var(--text); font-weight: 600; }
.ch-meta .cm .icon { width: 12px; height: 12px; color: var(--faint); }
.ch-meta .cm.quiet { color: var(--faint); white-space: normal; overflow-wrap: anywhere; }
.ch-meta .e { color: var(--err); font-weight: 600; background: var(--err-soft); padding: 0 7px; border-radius: 5px; }
.ch-meta .e .icon { color: var(--err); }
.cmdchip.shell { color: var(--tool); background: var(--tool-soft); }
.cmdchip.shell::before { content: none; }
.cmdchip .icon { width: 12px; height: 12px; }
.shcard { margin: 12px 0 0; border: 1px solid var(--edge); border-radius: var(--r); background: var(--out); overflow: hidden; }
.shcard .cin { padding-right: 12px; }
.shcard pre.res { font: var(--t-sm)/1.55 var(--mono); max-height: 360px; overflow: auto; }
/* a chapter's link mark sits beside its number, not above the rule */
section.chapter > .blink { top: 30px; left: -28px; }
.chwrap:first-child section.chapter > .blink { top: 12px; }
.cmdchip { display: inline-flex; align-items: center; gap: 6px; font: 700 var(--t-sm) var(--mono);
    color: var(--you); background: var(--you-soft); border-radius: 5px; padding: 2px 9px; margin-bottom: 6px; }
.cmdchip::before { content: '❯'; opacity: .6; }
/* long prompt body = clamped epigraph */
.epi { position: relative; margin: 12px 0 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--you);
    color: var(--dim); font-size: var(--t-md); }
.epi .content { color: var(--dim); font-size: var(--t-md); }
.epi.clamped .epi-in { max-height: 7.2em; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.epi .epi-more { margin-top: 6px; }

/* claude passages */
.passage { margin-top: 20px; }
.byline { display: flex; align-items: baseline; gap: 8px; font: var(--t-xs) var(--mono); color: var(--faint);
    margin-bottom: 4px; }
.byline .who { color: var(--claude); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: var(--t-xs); }
.byline .hgap { flex: 1; }
.byline .cp { background: none; border: none; color: var(--faint); font: var(--t-xs) var(--mono); opacity: 0; padding: 0 4px; }
.passage:hover .cp { opacity: 1; } .cp:hover { color: var(--text); } .cp.ok { color: var(--add); opacity: 1; }
.content { overflow-wrap: break-word; }
.content > :first-child { margin-top: 0; } .content > :last-child { margin-bottom: 0; }
.content p, .content ul, .content ol { margin: 10px 0; }
/* bold marks a phrase, it should not shout; lists sit close to the text they belong to */
.content strong, .content b { font-weight: 600; color: color-mix(in srgb, var(--text) 88%, var(--dim)); }
.content ul, .content ol { padding-left: 1.3em; }
.content li { margin: 3px 0; padding-left: .15em; }
.content li > ul, .content li > ol { margin: 3px 0; padding-left: 1.1em; }
.content li::marker { color: var(--faint); }
.content h1, .content h2 { font: 600 var(--t-lg)/1.4 var(--serif); margin: 22px 0 8px; }
.content h3, .content h4 { font: 600 var(--t-lg)/1.4 var(--sans); margin: 18px 0 6px; }
.content a { color: var(--you); text-decoration-color: color-mix(in srgb, var(--you) 40%, transparent); }
.content code { font: var(--t-sm) var(--mono); background: var(--bg2); border-radius: 4px; padding: 1.5px 5px; }
.content pre { background: var(--well); border: 1px solid var(--edge); border-radius: var(--r);
    padding: 12px 14px; overflow-x: auto; font-size: var(--t-sm); line-height: 1.6; }
.content pre code { background: none; padding: 0; font-size: inherit; }
.content blockquote { margin: 12px 0; padding: 8px 14px; border-left: 2px solid var(--edge2); color: var(--dim);
    background: color-mix(in srgb, var(--well) 70%, transparent); border-radius: 0 var(--r) var(--r) 0; }
.content blockquote > :first-child { margin-top: 0; } .content blockquote > :last-child { margin-bottom: 0; }
.content blockquote .callout-h:first-child { margin-top: 0; }
/* tables: one outer frame, a tinted header, row rules only */
.content table { border-collapse: separate; border-spacing: 0; font-size: var(--t-sm); line-height: 1.45; display: block;
    overflow-x: auto; max-width: 100%; width: max-content; border: 1px solid var(--edge); border-radius: var(--r); margin: 12px 0; }
.content th, .content td { padding: 6px 12px; text-align: left; vertical-align: top; border: none; border-bottom: 1px solid var(--edge); }
.content th { background: var(--well); font: 600 var(--t-xs) var(--sans); color: var(--dim); white-space: nowrap; }
.content tr:last-child td { border-bottom: none; }
.content tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--well) 45%, transparent); }
.content hr { border: none; border-top: 1px solid var(--edge); margin: 16px 0; }
.content .callout-h { display: inline-block; font: 700 var(--t-xs) var(--mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--meta); margin-top: 6px; }
.content mark { background: var(--mark); color: inherit; border-radius: 2px; }

/* ================= activity ledger */

/* an expanded block (skill body, hook text, peer message): its own surface, capped and scrollable */

/* ================= tool rail (owner D3b) */
.k-shell { --kc: var(--tool); } .k-file, .k-edit { --kc: var(--you); } .k-find { --kc: var(--claude); }
.k-web { --kc: var(--sky); } .k-agent, .k-todo { --kc: var(--meta); } .k-mcp { --kc: var(--rose); }

/* a run of work sits tight under the paragraph it belongs to; the next

.ledger { margin-top: 6px; border: none; border-radius: 0; background: none; overflow: visible; }

.rail { position: relative; margin: 4px 0 4px 11px; padding-left: 24px; }

    font: var(--t-sm) var(--mono); color: var(--faint); font-style: normal; }

    display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--bg);
    color: color-mix(in srgb, var(--kc) 50%, var(--faint)); background: color-mix(in srgb, var(--kc) 9%, var(--bg));
    transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }

.rail .trow .tn, .rail .throw .thl { flex: none; font-weight: 700; color: color-mix(in srgb, var(--kc) 55%, var(--faint)); }
.rail .trow .tp, .rail .throw .tp { color: var(--faint); }

/* hover shows the colour; an opened call keeps it */
.rail .trow:hover, .rail .trow.pin, .rail .throw:hover, .rail .throw.pin { background: color-mix(in srgb, var(--kc) 7%, transparent); }
.rail .trow:hover .node, .rail .trow.pin .node, .rail .throw:hover .node, .rail .throw.pin .node {

/* an opened call: its own surface, one shade off the page, quieter text */
.rail .tbody { margin: 2px 0 8px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--out); }
.rail .tb-scroll { font: var(--t-sm)/1.6 var(--mono); color: var(--dim); max-height: 420px; }
.rail .res-head { border-top-color: var(--edge); }
.rail pre.res { color: var(--dim); }

/* an opened call: the input as a terminal band (a shade darker), the output below */
.rail .tb-scroll { padding: 0; }
.cin { position: relative; padding: 10px 40px 10px 12px; background: var(--term); border-bottom: 1px dashed var(--edge2); }
.cout { padding: 9px 12px 11px; }
/* copy the input or the output: a quiet icon, the input's at its top right */
.ccp { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0;

.res-head .ccp { margin-left: auto; }
.res-head .ccp::before { content: none; }
.cmdline { font: var(--t-sm)/1.6 var(--mono); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.cmdline .ps { color: var(--faint); font-weight: 400; margin-right: 2px; }
.sh-p { color: var(--tool); font-weight: 700; } .sh-f { color: var(--meta); } .sh-s { color: var(--add); }
.sh-v { color: var(--sky); } .sh-o { color: var(--err); font-weight: 600; } .sh-c { color: var(--faint); font-style: italic; }
.cdesc { margin-top: 4px; font: var(--t-xs) var(--sans); color: var(--faint); }
.rail .res-head, .res-head { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding: 0; border: none;
    font: var(--t-xs) var(--mono); letter-spacing: 0; text-transform: none; color: var(--faint); }
.res-head b { color: var(--dim); font-weight: 600; }
.res-head span::before { content: '·'; margin-right: 8px; }
.res-head .icon { width: 12px; height: 12px; }
.res-head.err, .res-head.err b { color: var(--err); }
.res-more { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 0; border: none; background: none;

.res-more .icon { width: 12px; height: 12px; }

/* opening a call eases in; rows ease their colour */

.rail .trow, .rail .throw { transition: background var(--t-fast) var(--ease); }
/* permission mode: a badge, coloured as the menu bar colours it */

.modeline .ts { margin-left: auto; font: var(--t-xs) var(--mono); color: var(--faint); }

/* an image named in prose: a preview card, its path the caption */

.chbar button:disabled { opacity: .3; cursor: default; }
.chbar .lab { font: 600 var(--t-sm) var(--sans); color: var(--dim); padding: 0 8px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chbar .lab b { color: var(--text); font-family: var(--mono); font-weight: 700; }
.jumpnew { position: fixed; bottom: 64px; left: 50%; translate: -50% 0; z-index: 55; display: none;
    align-items: center; gap: 6px; height: 32px; padding: 0 14px; border: none; border-radius: 999px;
    background: var(--you); color: #fff; font: 700 var(--t-sm) var(--sans); box-shadow: var(--shadow); }

/* ================= search modal */

.srow .icon { color: var(--faint); }

.srow input:focus { outline: none; }

.slist { max-height: min(52vh, 460px); overflow-y: auto; overscroll-behavior: contain; }
.shit { display: flex; align-items: baseline; gap: 10px; padding: 9px 16px; cursor: pointer; }

/* moving between the board and a transcript (owner D1 note): the card's title

.mh-title, .sk-title { view-transition-name: sess-title; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: 220ms; animation-timing-function: cubic-bezier(.2, 0, 0, 1); }

    border: 1px solid color-mix(in srgb, var(--err) 40%, transparent); border-left: 3px solid var(--err);
    border-radius: var(--r); background: var(--err-soft); font-size: var(--t-md); }

/* Per-block permalink — a '#' that appears on hover in every direction; the
   block a #r<seq> URL points at wears a light left border. */
[data-seq] { position: relative; }
.blink { position: absolute; left: -24px; top: 2px; width: 20px; height: 20px;

[data-seq]:hover > .blink { display: inline-flex; }
.blink:hover { color: var(--you); background: var(--you-soft); opacity: 1; }

.linked { box-shadow: inset 2.5px 0 0 var(--you-ring); }

.tl-track:hover .tl-bars rect { fill: color-mix(in srgb, var(--dim) 60%, transparent); }

/* Every URL and file path the page shows opens in a new tab and has a copy

const LINK_RE = /https?:\/\/[^\s<>"'`]+|(?:~|\/(?:Users|private|tmp|var|opt|etc|Applications|Volumes|usr|Library|System))(?:\/[^\s<>"'`:,;()\[\]{}|*]+)+|(?:\.{1,2}\/|[\w@.-]+\/)[\w@.\/-]*\.[A-Za-z]\w{0,6}(?![\w@\/-]|\.\w)/g;

        if (!cwd) return '';
        p = cwd.replace(/\/$/, '') + '/' + p.replace(/^\.\//, '');
        return '/f?p=' + encodeURIComponent(p) + '&rel=' + encodeURIComponent(text);

            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = [];
    const has = new RegExp(LINK_RE.source);
    while (walk.nextNode()) if (has.test(walk.currentNode.nodeValue)) nodes.push(walk.currentNode);
    root.querySelectorAll('a[href]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    for (const node of nodes) {

            a.className = 'lk'; a.dataset.href = href; a.dataset.raw = text; a.textContent = text;
            a.title = IS_LOCAL || /^https?:/.test(text) ? 'Open in a new tab' : 'Copy (files open on the Mac)';
            const cp = document.createElement('span');
            cp.className = 'lk-cp'; cp.dataset.raw = text; cp.title = 'Copy'; cp.innerHTML = ic('copy');

        body: `<img class="pm-img" src="${esc(href)}" alt="${esc(name)}">` });

/* A box drawn in prose (┌─ Title ─┐ / │ body / └───┘) becomes a quoted
   callout with its title as a label. Code fences are left alone. */
function boxCallouts(s) {
    const lines = s.split('\n'), out = [];
    let fence = false;
    for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (/^\s*(```|~~~)/.test(l)) fence = !fence;
        const top = !fence && l.match(/^\s*(?:>\s*)?[┌╭┏]\s*[─━]*\s*(.*?)\s*[─━]*\s*[┐╮┓]?\s*$/);
        if (!top) { out.push(l); continue; }
        const body = [];
        let j = i + 1;
        for (; j < lines.length; j++) {
            const b = lines[j];

        if (j >= lines.length) { out.push(l); continue; }   // never closed: not a box
        out.push('', `> <span class="callout-h">${esc(top[1] || 'note')}</span>`, '>');
        body.forEach(b => out.push('> ' + b + (b.trim() ? '  ' : '')));   // each boxed line keeps its own line

function searchable(r) {

        const a = Math.max(0, i - 40);
        return { id: r.id, seq: r.seq, role: r.role, field: 'text', tool_id: null, ts: r.ts,
            snippet: (a ? '…' : '') + txt.slice(a, i + term.length + 90), at: i - a + (a ? 1 : 0) };

    if (term.length < 2) { state.hits = localHits(term); state.total = state.hits.length; state.hitIdx = 0; renderHits(); return; }
    const my = ++searchSeq;
    searchTimer = setTimeout(async () => {
        let hits, total;

            if (!res.ok) throw new Error(res.status);

}

    const lastTs = (state.records.findLast ? state.records.findLast(r => r.ts_iso) : null) || {};

        setLiveState('ended');

/* A tools group flushed while the agent is still mid-burst keeps its seq and

        // Growth is new calls, or outputs arriving for calls already shown.
        const size = x => (x.tools || []).length + (x.tools || []).filter(t => t.result).length;

        }
        const known = new Set(state.records.map(x => x.id));
        const fresh = data.records.filter(r => !known.has(r.id));
        const grew = refreshOpen(data.records.filter(r => known.has(r.id)));

    const ext = (p.match(/\.([A-Za-z0-9]+)$/) || [])[1];

        json: 'json', sh: 'bash', swift: 'swift', html: 'xml', css: 'css', yml: 'yaml', yaml: 'yaml', toml: 'ini', go: 'go', rs: 'rust' };

/* A thinking block: one collapsed line; the full text loads on expand. */
function thinkingHTML(r) {

        `<span class="tk">${r.words} words</span></button>${body}`;

/* A tool call's output: the preview /data carries, then the full body on demand. */
function resultHTML(t) {

    const full = FULL.get(t.id);

        `<span>${res.lines} line${res.lines === 1 ? '' : 's'}</span><span>${kfmt(res.chars)} chars</span>${copyBtn('out', t.id, 'Copy the output')}</div>` +
        `<pre class="res${res.is_error ? ' err' : ''}">${text ? (res.is_error ? esc(text) : colourText(text, outputLang(t))) : '<span class="cap">(empty)</span>'}</pre>` +

/* Full bodies fetched from /data?result=<id>, kept across re-renders. */
const FULL = new Map(), INPUTS = new Map(), _fullFetching = new Map();
/* A call with its full input: inline when /data sent it, else once fetched. */
function withInput(t) {
    if (t.input !== undefined || !INPUTS.has(t.id)) return t;
    return Object.assign({}, t, { input: INPUTS.get(t.id) });
}
/* The expanded body of one call: input, then output. A large input was left

function callBody(t) {
    if (t.input === undefined && t.input_chars && !INPUTS.has(t.id)) {
        fetchFull(t.id);
        return `<div class="cin"><div class="cap">loading ${kfmt(t.input_chars)} chars of input…</div></div><div class="cout">${resultHTML(t)}</div>`;
    }
    return `<div class="cin">${copyBtn('in', t.id, 'Copy the input')}${toolBody(withInput(t))}</div><div class="cout">${resultHTML(t)}</div>`;
}
const copyBtn = (which, id, tip) => `<button class="ccp" data-cp="${which}" data-ref="${esc(id || '')}" title="${tip}">${ic('copy')}</button>`;
function findTool(id) {
    for (const r of state.records) if (r.role === 'tools') for (const t of r.tools) if (t.id === id) return withInput(t);
    return null;
}
/* What "copy" means for a call: the command for Bash, the new text for an
   edit, the input as JSON otherwise; the output in full, fetched if needed. */
async function copyCall(btn) {
    const t = findTool(btn.dataset.ref);
    if (!t) return;
    let txt = '';
    if (btn.dataset.cp === 'in') {
        const i = t.input || {};
        txt = t.name === 'Bash' ? i.command || '' : t.name === 'Write' ? i.content || ''
            : /Edit/.test(t.name) ? i.new_string || '' : JSON.stringify(i, null, 2);
    } else {
        if (!FULL.has(t.id) && t.result && t.result.chars > (t.result.preview || '').length) await fetchFull(t.id);
        txt = FULL.has(t.id) ? FULL.get(t.id) : (t.result && t.result.preview) || '';

    const b = document.querySelector(`.ccp[data-cp="${btn.dataset.cp}"][data-ref="${CSS.escape(btn.dataset.ref)}"]`) || btn;
    b.classList.add('ok'); b.innerHTML = ic('check');
    setTimeout(() => { b.classList.remove('ok'); b.innerHTML = ic('copy'); }, 1200);
}
document.addEventListener('click', e => {
    const b = e.target.closest('.ccp');
    if (!b) return;
    e.preventDefault(); e.stopImmediatePropagation();
    copyCall(b);
}, true);
function fetchFull(id) {
    if (!id || FULL.has(id)) return Promise.resolve();
    if (_fullFetching.has(id)) return _fullFetching.get(id);
    const p = fetch(API + 'data?result=' + encodeURIComponent(id), { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => {
            FULL.set(id, d.result != null ? d.result : (d.thinking != null ? d.thinking : ''));
            if (d.input !== undefined) INPUTS.set(id, d.input);
            refillWhere(`[data-ref="${CSS.escape(id)}"]`);
        })
        .catch(() => {})
        .finally(() => _fullFetching.delete(id));
    _fullFetching.set(id, p);

}
/* one run of consecutive tools/events, rendered per the active direction's tool-row knob */
function runHTML(run, key) {
    const tr = (state.dir && state.dir.toolrow) || 'well';
    if (tr === 'well') return ledgerHTML(run, key);
    const rows = ledgerRowsHTML(run);
    if (tr === 'bare') return `<div class="bare">${rows}</div>`;
    const nTools = run.reduce((a, r) => a + (r.tools ? r.tools.length : 0), 0);
    const sum = ledgerSummary(run);
    return `<div class="wcard${nTools <= 1 ? ' solo' : ''}">${rows}${nTools <= 1 ? '' : `<div class="wc-foot">${sum.html}</div>`}</div>`;
}
function applyDir(name) {
    const d = DIRECTIONS[name] || DIRECTIONS.chapters;
    state.dir = d; state.dirName = name;
    document.documentElement.dataset.dir = name;
    document.documentElement.style.setProperty('--measure', d.measure + 'px');
    document.body.classList.toggle('no-outline', !d.sidebar);
    const ob = $('#olBtn'); if (ob) ob.style.display = d.sidebar ? '' : 'none';
    if (!d.sidebar) closeOutline();
    const tlPref = load('hx-tl', null);
    setTimeline(tlPref == null ? d.timeline : tlPref === '1');
    seg('#vpDir', name, 'dir');
    const hint = $('#vpDirHint'); if (hint) hint.textContent = d.hint;

    if (state.mode === 'normal') renderChapters();
}
const applyPalette = HubShared.applyPalette;
/* One text size for every size on the page (and the board, which reads the
   same setting): 14.5 is 100%. */
function applyTextSize(px) {
    document.documentElement.style.setProperty('--k', (px / HubShared.FS_DEFAULT).toFixed(3));
    const v = $('#vpFsVal'); if (v) v.textContent = Math.round(px / HubShared.FS_DEFAULT * 100) + '%';
    const r = $('#vpFs'); if (r) r.value = px;
    save('hx-fs', px);
}
/* The session timeline: work per slice of time as bars, your messages as blue
   ticks under them, errors as red ticks over them. It sits under the title
   and sticks there. The stretch on screen is shaded; dragging shows the stretch
   being picked, and letting go jumps to its start (a plain click jumps there). */
let tlBuilt = false, TL = null;
function clockOf(ms, withDay) {
    const d = new Date(ms);
    const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return withDay ? `${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} ${hm}` : hm;
}
function buildTimeline(animate) {
    const rs = state.records.filter(r => r.ts_iso);
    if (rs.length < 2 || !$('#masthead')) return;
    const t0 = +new Date(rs[0].ts_iso), t1 = +new Date(rs[rs.length - 1].ts_iso), span = Math.max(1, t1 - t0);
    // Idle stretches (nights, days away) count as at most GAP of axis each, so
    // a session that spans days still shows its work instead of slivers.
    const GAP = 12 * 60000, T = rs.map(r => +new Date(r.ts_iso)), C = [0], breaks = [];
    for (let i = 1; i < T.length; i++) {
        const d = Math.max(0, T[i] - T[i - 1]);
        C[i] = C[i - 1] + Math.min(d, GAP);
        if (d > GAP * 1.5) breaks.push(C[i - 1] + GAP / 2);
    }
    const cspan = Math.max(1, C[C.length - 1]);
    const lastLE = (arr, v) => { let lo = 0, hi = arr.length - 1, k = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= v) { k = m; lo = m + 1; } else hi = m - 1; } return k; };
    const toX = t => { const i = lastLE(T, t); if (i < 0) return 0; const step = i + 1 < T.length ? C[i + 1] - C[i] : 0; return (C[i] + Math.min(t - T[i], step)) / cspan; };
    const toT = x => { const c = x * cspan, i = Math.max(0, lastLE(C, c)); return T[i] + (c - C[i]); };
    const N = 140, work = new Array(N).fill(0), pr = [], er = [];
    for (const r of rs) {
        const x = toX(+new Date(r.ts_iso));
        if (r.role === 'tools') work[Math.min(N - 1, Math.floor(x * N))] += (r.tools || []).length || 1;
        if (r.role === 'user' && ['typed', 'shell'].includes(turnOf(r))) pr.push(x);
        if (r.cls === 'err' || (r.role === 'tools' && (r.tools || []).some(t => t.is_error))) er.push(x);
    }
    const max = Math.max(...work, 1), W = 1000, H = 44, base = H - 7;
    let bars = '';

        const h = 3 + Math.round(Math.log(1 + work[i]) / Math.log(1 + max) * (H - 16));
        bars += `<rect x="${(i / N * W).toFixed(1)}" y="${base - h}" width="${(W / N * .7).toFixed(1)}" height="${h}" rx="1.5" style="animation-delay:${(i * 4)}ms"></rect>`; }
    const pt = pr.map(x => `<line x1="${(x * W).toFixed(1)}" x2="${(x * W).toFixed(1)}" y1="${base + 2}" y2="${H}"></line>`).join('');
    const et = er.map(x => `<line x1="${(x * W).toFixed(1)}" x2="${(x * W).toFixed(1)}" y1="0" y2="6"></line>`).join('');
    const bk = breaks.map(c => { const x = (c / cspan * W).toFixed(1); return `<line x1="${x}" x2="${x}" y1="10" y2="${base}"></line>`; }).join('');
    const multiDay = new Date(t0).toDateString() !== new Date(t1).toDateString();
    const el = document.createElement('div'); el.className = 'cctl' + (animate ? ' anim' : ''); el.id = 'cctl';
    el.innerHTML = `<div class="tl-lb"><span>${clockOf(t0, multiDay)}</span><span class="tl-hint">drag to pick a stretch, let go to jump</span><span>${clockOf(t1, multiDay)}</span></div>` +
        `<div class="tl-track"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g class="tl-bars">${bars}</g>` +
        `<g class="tl-breaks" stroke="var(--edge2)" stroke-width="1.5" stroke-dasharray="2 3">${bk}</g>` +
        `<g stroke="var(--you)" stroke-width="2.5">${pt}</g><g stroke="var(--err)" stroke-width="2.5">${et}</g></svg>` +
        `<div class="tl-view"></div><div class="tl-sel"></div><div class="tl-cur"><span></span></div></div>`;

    const track = el.querySelector('.tl-track'), sel = el.querySelector('.tl-sel'), cur = el.querySelector('.tl-cur');
    const fx = ev => { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); };
    let down = null;
    track.addEventListener('pointerdown', ev => {
        down = fx(ev); track.setPointerCapture(ev.pointerId);

    });
    track.addEventListener('pointermove', ev => {
        const x = fx(ev);
        cur.style.left = x * 100 + '%'; cur.classList.add('on');
        cur.querySelector('span').textContent = clockOf(toT(x), multiDay);
        if (down == null) return;
        sel.style.left = Math.min(down, x) * 100 + '%'; sel.style.width = Math.abs(x - down) * 100 + '%';

    track.addEventListener('pointerup', ev => {
        if (down == null) return;
        const x = fx(ev), from = Math.abs(x - down) < .004 ? x : Math.min(down, x);
        down = null;
        setTimeout(() => sel.classList.remove('on'), 700);
        const tt = toT(from);
        let best = rs[0]; for (const rec of rs) { if (+new Date(rec.ts_iso) <= tt) best = rec; else break; }
        jumpToSeq(best.seq);
    });

}
/* Shade the stretch of time the reader has on screen. */
function updateTimelineView() {
    if (!TL || !TL.el.classList.contains('on')) return;
    const seqAt = y => {
        const el = document.elementFromPoint(Math.min(innerWidth - 20, Math.max(20, ($('.colwrap') || document.body).getBoundingClientRect().left + 40)), y);
        const n = el && el.closest('[data-seq]');
        return n ? +n.dataset.seq : null;
    };
    const top = TL.el.getBoundingClientRect().bottom + 8;
    const a = seqAt(top), b = seqAt(innerHeight - 30);
    const tsOf = seq => { let best = null; for (const r of TL.rs) { if (r.seq <= seq) best = r; else break; } return best ? +new Date(best.ts_iso) : null; };
    const ta = a != null ? tsOf(a) : null, tb = b != null ? tsOf(b) : ta;
    const v = TL.el.querySelector('.tl-view');
    if (ta == null) { v.style.opacity = '0'; return; }
    const l = TL.toX(ta), r = TL.toX(tb || ta);
    v.style.opacity = '1';
    v.style.left = Math.max(0, l) * 100 + '%';
    v.style.width = Math.max(1.4, (Math.min(1, r) - l) * 100) + '%';
}
function setTimeline(on, byUser) {
    if (byUser) save('hx-tl', on ? '1' : '0');   // a user's choice outlives reloads
    if (on && !tlBuilt && state.mode === 'normal') { buildTimeline(true); tlBuilt = !!$('#cctl'); }
    const s = $('#cctl'); if (s) s.classList.toggle('on', on);
    const t = $('#vpTl'); if (t) t.checked = on;
    updateTimelineView();
}
/* live records shift the time span, and a re-rendered masthead drops the
   strip: swap in a fresh one rather than let it go stale */
function rebuildTimeline() {
    const want = load('hx-tl', '1') === '1';
    const old = $('#cctl');
    if (old) old.remove();
    TL = null; tlBuilt = false;
    if (want && state.mode === 'normal') { buildTimeline(false); tlBuilt = !!$('#cctl'); const s = $('#cctl'); if (s) s.classList.add('on'); updateTimelineView(); }
}
/* view panel wiring */
/* View Transitions: soft crossfade on user-initiated look changes only —
   never on live appends. No-op where unsupported or with reduced motion. */
const vt = fn => (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches)
    ? document.startViewTransition(fn) : fn();
$('#viewBtn').onclick = () => { const p = $('#viewPanel'); const o = p.classList.toggle('open'); $('#viewBtn').setAttribute('aria-pressed', String(o)); };
document.addEventListener('click', e => {
    if (!e.target.closest('#viewPanel') && !e.target.closest('#viewBtn')) { $('#viewPanel').classList.remove('open'); $('#viewBtn').setAttribute('aria-pressed', 'false'); }
});
$('#vpDir').onclick = e => { const b = e.target.closest('button'); if (b) vt(() => applyDir(b.dataset.dir)); };
$('#vpSkin').onclick = e => { const b = e.target.closest('button'); if (b) vt(() => applyPalette(b.dataset.skin)); };
$('#vpTheme').onclick = e => { const b = e.target.closest('button'); if (b) vt(() => chooseTheme(b.dataset.theme)); };
/* Resizing text reflows every chapter; hold the block at the top of the screen in place. */
$('#vpFs').oninput = e => {
    const y = headOffset() + 4;
    const anchor = [...document.querySelectorAll('#chapters [data-seq]')].find(el => el.getBoundingClientRect().bottom > y);
    const before = anchor ? anchor.getBoundingClientRect().top : 0;
    applyTextSize(+e.target.value);
    if (anchor) window.scrollBy(0, anchor.getBoundingClientRect().top - before);

$('#vpTl').onchange = e => setTimeline(e.target.checked, true);

/* ================= init — fetch the real session, then go live */
applyTheme(savedTheme() || (osTheme.matches ? 'light' : 'dark'));
osTheme.addEventListener('change', e => { if (!savedTheme()) applyTheme(e.matches ? 'light' : 'dark'); });
HubShared.paletteButtons($('#vpSkin'));
applyDir('chapters');   // the reading view; the other directions are retired
applyPalette(HubShared.savedPalette());
applyTextSize(HubShared.savedSize());
HubShared.blockCopy('.content p, .content li, .content td, .content th, .content pre, .content blockquote', ic('copy'));
setLiveState('working');
/* Stale-while-revalidate: the last copy of this session's /data lives in the
   browser's Cache (the hub also refreshes it when a card is hovered), so a
   revisit paints at once and a tiny spinner after the title shows the fresh
   fetch. The Cache API needs a secure context (this Mac); elsewhere it is a
   plain fetch. */
const DATA_URL = new URL(API + 'data', location.href).href;
async function cachedData() {
    try { const c = await caches.open('hub-data'); const r = await c.match(DATA_URL); return r ? await r.json() : null; }
    catch (e) { return null; }
}
function storeData(text) {
    try { caches.open('hub-data').then(c => c.put(DATA_URL, new Response(text, { headers: { 'Content-Type': 'application/json' } }))); } catch (e) {}
}
function fetching(on) { const d = $('#fetchDot'); if (d) d.hidden = !on; }
function showData(data) {
    window.SESSION.meta = data.meta;
    window.SESSION.records = data.records;
    state.meta = data.meta;
    state.records = data.records;
    // Same name the board card showed, so opening a card never renames it:
    // Claude Code's title, else the card's own name, else the folder.
    let hint = null;
    try { hint = JSON.parse(sessionStorage.getItem('hub-open') || 'null'); } catch (e) {}
    if (hint && !location.pathname.includes(hint.sid)) hint = null;
    const folder = String(data.meta.cwd || '').replace(/\/+$/, '').split('/').pop();
    TITLE = (data.meta.ai_title || '').trim() || (hint && hint.title) || folder || 'Claude Code session';
    document.title = TITLE;
    $('#tbTitle').textContent = TITLE;
    lastId = lastClosedId(data.records);
    if (data.meta.live === false) state.isLive = false;
    setMode(data.records.length ? 'normal' : 'empty');
}
async function boot() {
    // Paint the named loading title before the first await: a view transition
    // snapshots this page at its first frame, and a title that only appears
    // after the cache answers has nothing to morph into.
    setMode('loading');
    const stale = await cachedData();
    if (stale && stale.records) showData(stale);
    fetching(true);
    try {
        const res = await fetch(API + 'data', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const data = JSON.parse(text);
        storeData(text);
        const same = stale && stale.records && stale.records.length === data.records.length &&
            lastClosedId(stale.records) === lastClosedId(data.records);
        if (!same) showData(data);
        startLive();
        pollOk();
        applyStatus(data.meta, false);
        applyHash();   // deep link (#r<seq>[&q=…]) from the hub or a copied block link
    } catch (e) { if (!stale) setMode('error'); }
    fetching(false);
}
window.boot = boot;
boot();
